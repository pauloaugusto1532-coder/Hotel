name: Coletar Google Trends - São Lourenço

on:
  schedule:
    - cron: '0 9 * * *'   # todo dia às 09:00 UTC (~06:00 em Brasília)
  workflow_dispatch: {}    # também permite rodar manualmente pelo GitHub

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pytrends pandas

      - name: Rodar coleta
        run: python collect_trends.py

      - name: Salvar trends.json atualizado no repositório
        run: |
          git config user.name "trends-bot"
          git config user.email "trends-bot@users.noreply.github.com"
          git add trends.json
          git diff --cached --quiet || git commit -m "Atualiza trends.json $(date -u +%Y-%m-%d)"
          git push
